<h2>Conversation with {{ conversation.participants.exclude(id=request.user.id).first }}</h2>
{% for message in messages %}
<p><strong>{{ message.sender }}:</strong> {{ message.content }}</p>
{% endfor %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send</button>
</form>
