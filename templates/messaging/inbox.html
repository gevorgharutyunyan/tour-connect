<h2>Inbox</h2>
<ul>
    {% for item in conversation_data %}
            <a href="{% url 'messaging:conversation_view' item.conversation.id %}">
                {% if item.other_user_username %}
                    {% if item.last_message %}
                       <strong>{{ item.other_user_username }}:</strong>
                    {% endif %}
                {% endif %}
            </a>
    {% endfor %}
</ul>
