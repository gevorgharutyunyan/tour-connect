{% extends 'base.html' %}

{% block content %}
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete this image?</p>

    <img src="{{ object.image.url }}" alt="{{ object.caption }}" width="200">

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'tours:tour-detail' object.tour.id %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
