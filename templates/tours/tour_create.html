{% extends "base.html" %}
{% block content %}
  <h2>Create a New Tour</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    {{ tour_date_formset.management_form }}
    {% for tour_date_form in tour_date_formset %}
        {{ tour_date_form.as_p }}
    {% endfor %}
    <button type="submit">Create Tour</button>
  </form>
{% endblock %}
